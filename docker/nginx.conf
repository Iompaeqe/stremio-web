# Static server for the stremio-web production build.
#
# The build is fully relative: webpack's `output.publicPath` is left at its default ("auto"), so
# every asset URL (scripts, css, fonts, images, the wasm binary, the web worker and the service
# worker) is resolved at runtime from the document / worker script location. That means this
# server can be mounted at "/" (as it is here) and reverse-proxied under any subpath without a
# rebuild, as long as the proxy strips the prefix and the trailing slash is present.
#
# On HomeIomp it sits behind:
#     redir /stremio /stremio/ 308
#     handle_path /stremio/* { reverse_proxy stremio-web:3000 }

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Caddy; let the proxy own the compression/TLS story but still gzip for direct LAN use.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    # Assets live under a commit-hash directory, so they are immutable per deploy.
    location ~ "^/[0-9a-f]{7,40}/" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The service worker must never be served stale, otherwise a deploy can never take effect.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback. Routing is hash based (#/board, #/discover, ...) so in practice only the mount
    # point itself is ever requested, but this keeps stray paths from 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
